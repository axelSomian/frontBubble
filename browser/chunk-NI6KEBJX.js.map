<div class="sidebar-container d-flex flex-column flex-shrink-0">
    <div class="sidebar-header p-4">
        <a href="/" class="d-flex align-items-center text-decoration-none brand-logo">
            <span class="fs-4 fw-bold">Anka<span class="text-primary">.</span></span>
        </a>
    </div>

    <div class="sidebar-menu px-3 flex-grow-1 overflow-auto custom-scrollbar">
        <!-- Section: Properties -->
        <span class="menu-label">Mes Biens</span>
        <ul class="nav nav-pills flex-column mb-4">
            <li class="nav-item">
                <a routerLink="addHouse" routerLinkActive="active" class="nav-link">
                    <div class="icon-wrapper"><i class="fa-solid fa-plus"></i></div>
                    <span>Ajouter un bien</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="allOwnerHouses" routerLinkActive="active" class="nav-link">
                    <div class="icon-wrapper"><i class="fa-solid fa-list-ul"></i></div>
                    <span>Mes biens</span>
                </a>
            </li>
        </ul>

        <!-- Section: Bookings -->
        <div class="menu-label-container d-flex align-items-center gap-2">
            <span class="menu-label mb-0 mt-0">Réservations</span>
            <span class="badge bg-light text-muted extra-small">WIP</span>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="javascript:void(0)" class="nav-link nav-link-wip">
                    <div class="icon-wrapper"><i class="fa-regular fa-calendar-plus"></i></div>
                    <span>Nouvelle Réservation</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="javascript:void(0)" class="nav-link nav-link-wip">
                    <div class="icon-wrapper"><i class="fa-regular fa-calendar-check"></i></div>
                    <span>Mes Réservations</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Footer / User Profile -->
    <div class="sidebar-footer p-3 mt-auto border-top" *ngIf="owner$ | async as owner">
        <div class="dropdown">
            <a href="#"
                class="d-flex align-items-center text-decoration-none dropdown-toggle user-profile p-2 rounded-3"
                data-bs-toggle="dropdown" aria-expanded="false">
                <div class="avatar-container position-relative me-3">
                    <img [src]="owner.profileimageUrl || '../../../../assets/images/user-default.webp'"
                        class="avatar-img rounded-3" alt="Profile">
                    <div class="status-online"></div>
                </div>
                <div class="d-flex flex-column overflow-hidden">
                    <strong class="user-name text-truncate">{{ owner.firstName }} {{ owner.lastName }}</strong>
                    <small class="text-muted extra-small">Propriétaire Anka</small>
                </div>
            </a>
            <ul class="dropdown-menu shadow border-0 rounded-4 p-2 mb-2 animate-slide-up">
                <li><a class="dropdown-item rounded-3 mb-1" href="#"><i class="fa-regular fa-user me-2"></i> Mon
                        Profil</a></li>
                <li><a class="dropdown-item rounded-3 mb-1" href="#"><i class="fa-solid fa-gear me-2"></i>
                        Paramètres</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item rounded-3 text-danger fw-medium" href="#"><i
                            class="fa-solid fa-arrow-right-from-bracket me-2"></i> Déconnexion</a></li>
            </ul>
        </div>
    </div>
</div>
