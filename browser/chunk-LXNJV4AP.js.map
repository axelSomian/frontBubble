<div class="login-page-wrapper">


  <div class="login-container shadow-premium rounded-5 overflow-hidden animate-slide-up">

    <!-- Branding Section (Desktop) -->
    <div class="logo-section d-none d-md-flex align-items-center justify-content-center">
      <div class="branding-content text-center">
        <div class="branding-icon-wrapper mb-4">
          <span class="branding-letter">A</span>
        </div>
        <h1 class="logo-text">Anka</h1>
        <div class="logo-dot"></div>
        <p class="branding-tagline mt-3">Trouvez votre prochain chez-vous en toute sérénité.</p>
      </div>
      <div class="branding-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="form-section p-4 p-lg-5 d-flex flex-column justify-content-center">
      <div class="form-header mb-5">
        <h2 class="fw-bold text-dark">Bon retour !</h2>
        <p class="text-muted">Connectez-vous pour continuer</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

        <!-- Email Input -->
        <div class="form-floating mb-4">
          <input type="text" id="email" class="form-control" [class.is-invalid]="error" (focus)="onFocus()"
            formControlName="email" placeholder="Email ou téléphone">
          <label for="email"><i class="fa-regular fa-envelope me-2"></i>Email ou téléphone</label>
        </div>

        <!-- Password Input -->
        <div class="form-floating mb-4">
          <input type="password" id="password" class="form-control" [class.is-invalid]="error" (focus)="onFocus()"
            formControlName="password" placeholder="Mot de passe">
          <label for="password"><i class="fa-solid fa-lock me-2"></i>Mot de passe</label>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="alert alert-danger border-0 rounded-4 mb-4 small animate-shake">
          <i class="fa-solid fa-circle-exclamation me-2"></i>
          {{message || 'Identifiants incorrects'}}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary-premium w-100 py-3 rounded-pill fw-bold shadow-sm"
          [disabled]="loginForm.invalid">
          <span>Se connecter</span>
          <i class="fa-solid fa-arrow-right ms-2 mt-1"></i>
        </button>

        <div class="text-center mt-4 pt-2">
          <p class="text-muted small">Vous n'avez pas de compte ?
            <a routerLink="/register" class="text-primary fw-bold text-decoration-none ms-1">Créer un compte</a>
          </p>
        </div>
      </form>
    </div>

  </div>
</div>
