<div class="container-fluid bg-white min-vh-100 py-5">
    <div class="container">
        <h1 class="visually-hidden">Résultats de recherche Anka AI - Bubble</h1>

        <!-- AI Header Summary -->
        <div class="text-center mb-5 animate-slide-down">
            <div
                class="d-inline-flex align-items-center gap-3 bg-light px-4 py-2 rounded-pill shadow-sm mb-4 border border-white">
                <div class="premium-badge-icon" style="background: linear-gradient(135deg, #0d6efd, #004dc2);">
                    <i class="fa-solid fa-house-chimney"></i>
                </div>
                <span class="fw-bold text-dark fs-5">Anka AI • Recherche Experte</span>
            </div>
            <h2 class="display-6 fw-bold text-dark mb-0">
                "{{message}}"
            </h2>
            <p class="text-muted mt-3">Voici les propriétés qui correspondent le mieux à votre recherche psychologique.
            </p>
        </div>

        <!-- Results Grid -->
        <div *ngIf="houselist.length > 0; else noResult">
            <div class="row g-4">
                @for (house of houselist; track $index) {
                <app-house-item [house]="house" class="col-12 col-sm-6 col-md-4 col-xl-3 col-xxl-3 animate-fade-in"
                    [style.animation-delay]="$index * 100 + 'ms'">
                </app-house-item>
                }
            </div>
        </div>

        <ng-template #noResult>
            <div class="text-center py-5">
                <p class="text-muted">Je n'ai rien trouvé correspondant exactement à cela. Essayez une autre demande !
                </p>
            </div>
        </ng-template>

    </div>
</div>

<anka-bubble></anka-bubble>
<anka-window></anka-window>
