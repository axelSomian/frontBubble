<!-- house-item.component.html -->
<div class="card border-0 rounded-4 overflow-hidden " routerLink="/houses/{{ house._id }}">

  <!-- Carousel -->
  <div *ngIf="house.imageUrl?.length" #carouselElem [id]="'carouselHouse' + house._id" class="carousel slide h-100"
    data-bs-ride="false" data-bs-interval="false">

    <!-- Indicateurs -->
    <div class="carousel-indicators">
      <button *ngFor="let img of house.imageUrl | slice:0:5; let i = index" type="button"
        [attr.data-bs-target]="'#carouselHouse' + house._id" [attr.data-bs-slide-to]="i" [class.active]="i === 0"
        [attr.aria-label]="'Slide ' + (i + 1)">
      </button>
    </div>

    <!-- Images -->
    <div class="carousel-inner">
      <div *ngFor="let img of house.imageUrl | slice:0:5; let i = index" class="carousel-item" [class.active]="i === 0">
        <img [src]="img" class="d-block w-100 img-fluid object-fit-cover img-zoom" style="height: 220px;"
          [alt]="'Image de ' + house.title" loading="lazy">
      </div>
    </div>

    <!-- Boutons -->
    <button class="carousel-control-prev" type="button" [attr.data-bs-target]="'#carouselHouse' + house._id"
      data-bs-slide="prev" (click)="$event.stopPropagation()">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>

    <button class="carousel-control-next" type="button" [attr.data-bs-target]="'#carouselHouse' + house._id"
      data-bs-slide="next" (click)="$event.stopPropagation()">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- Infos -->
  <div class="card-body p-3">
    <!-- Type & Neighboorhood -->
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h6 class="card-title fw-bold text-dark mb-0 text-truncate" style="max-width: 70%;">
        {{ house.type }}
      </h6>
      <div>

        <span class="badge bg-light text-secondary rounded-pill small fw-normal">
          {{ house.neighboorhood }}
        </span>
      </div>
    </div>

    <!-- Price -->
    <div class="d-flex justify-content-start align-items-center mt-3 pt-3 border-top border-light">
      <div class="text-start">
        <p class="mb-0 text-muted small text-uppercase fw-semibold" style="font-size: 0.7rem;">Prix</p>
        <p class="fw-bold text-primary mb-0 fs-5">
          {{ house.price | number }} <span class="fs-7 text-dark fw-normal">FCFA</span>
        </p>
      </div>
    </div>
  </div>
</div>
