<div class="anka-overlay" *ngIf="isOpen$ | async" (click)="close()"></div>

<div class="anka-window" *ngIf="isOpen$ | async">

  <!-- HEADER -->
  <div class="header">
    <div class="title">
      <div class="premium-icon-box me-2">
        <i class="fa-solid fa-house-chimney"></i>
      </div>
      <div class="d-flex flex-column">
        <span class="fw-bold fs-6 lh-1">Anka AI</span>
        <span class="small text-muted fw-normal" style="font-size: 0.7rem;">Expert Immobilier</span>
      </div>
    </div>
    <button class="close-btn" (click)="close()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="content">

    <!-- PAGE D'ACCUEIL -->
    <ng-container *ngIf="!loading && !showResult">

      <!-- Welcome Intro (Only if no messages) -->
      <div *ngIf="anka.messages.length === 0" class="text-center mt-4">
        <div class="intro">Bonjour 👋, je suis <strong>Anka</strong></div>
        <div class="sub">Explique-moi ce que tu recherches.</div>
      </div>

      <!-- Chat History -->
      <div class="chat-history flex-grow-1 overflow-auto px-2 mb-3" *ngIf="anka.messages.length > 0">
        <div *ngFor="let msg of anka.messages" [class.text-end]="msg.type === 'user'" class="mb-2">
          <div [ngClass]="msg.type === 'user' ? 'user-msg' : 'ai-msg'" class="d-inline-block px-3 py-2 rounded-3"
            style="max-width: 85%;">
            {{ msg.text }}
          </div>
        </div>
      </div>

      <div class="input-area" [formGroup]="form">
        <input type="text" placeholder="Parlez à Anka..." formControlName="message" (keydown.enter)="send()" />
        <button (click)="send()">➤</button>
      </div>

      <div *ngIf="errorMessage" class="error-msg text-danger small text-center mt-2 px-3">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ errorMessage }}
      </div>
    </ng-container>

    <!-- SPINNER IA -->
    <ng-container *ngIf="loading">
      <div class="spinner-wrapper">
        <div class="ai-loader"></div>
        <div class="ai-text">Anka est en train de réfléchir...</div>
      </div>
    </ng-container>

    <!-- PAGE RESULTAT -->
    <div *ngIf="showResult">

    </div>

  </div>
</div>
