<header class="main-header sticky-top">
  <div class="container-fluid d-flex justify-content-between align-items-center h-100 px-4">

    <!-- Logo -->
    <a class="d-flex align-items-center text-decoration-none logo-wrapper" href="/">
      <h1 class="logo-text">Anka<span class="text-primary fs-1 lh-1">.</span></h1>
    </a>

    <!-- Right Side Actions -->
    <div class="header-actions">

      @if(isLoggedIn){
      @if(owner$ | async; as owner) {
      @if(type === 'admin') {
      <!-- Admin Menu -->
      <div class="dropdown user-dropdown">
        <button class="btn btn-auth-trigger d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          <div class="avatar-circle">
            <img [src]="owner.profileimageUrl || '../../assets/images/user-default.webp'" alt="User"
              class="object-fit-cover w-100 h-100">
          </div>
          <div class="d-none d-md-block text-start">
            <div class="user-label">{{ owner.firstName }} {{ owner.lastName }}</div>
          </div>
          <i class="fa-solid fa-chevron-down small user-chevron text-muted ms-1"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow-premium border-0 rounded-4 mt-2 p-2 animate-slide-up">
          <li>
            <h6 class="dropdown-header small text-uppercase fw-bold text-muted py-2 px-3">Administration</h6>
          </li>
          <li><a class="dropdown-item rounded-3 mb-1" routerLink="/admin"><i class="fa-regular fa-user me-2"></i> Profil
              Admin</a></li>
          <li><a class="dropdown-item rounded-3 mb-1" href=""><i class="fa-solid fa-gear me-2"></i> Paramètres</a></li>
          <li>
            <hr class="dropdown-divider my-2">
          </li>
          <li><a class="dropdown-item rounded-3 text-danger fw-medium" (click)="logout()" style="cursor: pointer;"><i
                class="fa-solid fa-arrow-right-from-bracket me-2"></i> Déconnexion</a></li>
        </ul>
      </div>
      } @else {
      <!-- User Menu -->
      <div class="dropdown user-dropdown">
        <button class="btn btn-auth-trigger d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          <div class="avatar-circle">
            <img [src]="owner.profileimageUrl || '../../assets/images/user-default.webp'" alt="User"
              class="object-fit-cover w-100 h-100">
          </div>
          <div class="d-none d-md-block text-start">
            <div class="user-label">{{ owner.firstName }} {{ owner.lastName }}</div>
          </div>
          <i class="fa-solid fa-chevron-down small user-chevron text-muted ms-1"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow-premium border-0 rounded-4 mt-2 p-2 animate-slide-up">
          <li><a class="dropdown-item rounded-3 mb-1 py-2" href=""><i
                class="fa-regular fa-circle-user me-2 text-primary"></i> Mon Profil</a></li>
          <li><a class="dropdown-item rounded-3 mb-1 py-2" href=""><i class="fa-regular fa-heart me-2 text-primary"></i>
              Mes favoris</a></li>
          <li><a class="dropdown-item rounded-3 mb-1 py-2" href=""><i class="fa-solid fa-sliders me-2 text-primary"></i>
              Paramètres</a></li>
          <li>
            <hr class="dropdown-divider my-2">
          </li>
          <li><a class="dropdown-item rounded-3 text-danger fw-medium" (click)="logout()" style="cursor: pointer;"><i
                class="fa-solid fa-arrow-right-from-bracket me-2"></i> Déconnexion</a></li>
        </ul>
      </div>
      }
      }
      } @else {
      <!-- Guest Menu -->
      <div class="d-flex align-items-center gap-2 gap-md-3">
        <a routerLink="/login" class="btn btn-login-pill">
          <i class="fa-solid fa-user-circle d-md-none"></i>
          <span class="d-none d-md-inline">Se connecter</span>
        </a>
        <a routerLink="/register"
          class="btn btn-primary rounded-pill px-3 px-md-4 fw-bold shadow-sm btn-register-premium">
          <i class="fa-solid fa-plus-circle d-md-none"></i>
          <span class="d-none d-md-inline">S'inscrire</span>
        </a>
      </div>
      }

    </div>
  </div>
</header>
